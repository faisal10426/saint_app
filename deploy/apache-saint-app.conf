<VirtualHost *:80>
    ServerName 162.35.172.247
    ServerAdmin webmaster@localhost

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    <LocationMatch "^/(index\.html)?$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </LocationMatch>
    <Location "/service-worker.js">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </Location>
    <Location "/manifest.webmanifest">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </Location>
    <Location "/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/saint-app-error.log
    CustomLog ${APACHE_LOG_DIR}/saint-app-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName 162.35.172.247
    ServerAdmin webmaster@localhost

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/saint-app.crt
    SSLCertificateKeyFile /etc/ssl/private/saint-app.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    RequestHeader set X-Forwarded-Proto "https"

    <LocationMatch "^/(index\.html)?$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </LocationMatch>
    <Location "/service-worker.js">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </Location>
    <Location "/manifest.webmanifest">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </Location>
    <Location "/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/saint-app-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/saint-app-ssl-access.log combined
</VirtualHost>
